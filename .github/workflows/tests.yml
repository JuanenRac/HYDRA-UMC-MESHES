# Runs the tests of the check of the package manifest (tests/) under line and branch coverage and holds the floor (95 %) on tools/verify_pack.py.
# =============================================================================
name: Package tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Test the check of the package manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the test tools
        run: python -m pip install pytest coverage
      - name: Run the tests under coverage
        run: python -m coverage run --branch --include=tools/verify_pack.py -m pytest tests -q
      - name: Report the coverage and hold the floor
        run: python -m coverage report -m --fail-under=95
